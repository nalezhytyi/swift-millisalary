# The Xcode project is generated from this file: run `xcodegen generate`
# after changing it or adding files (Millisalary.xcodeproj is not committed)
name: Millisalary

options:
  bundleIdPrefix: com.nalezhytyi
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.1.2
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # No Developer ID: signed ad hoc, not notarized
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  MillisalaryCore:
    path: Packages/MillisalaryCore
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift
    exactVersion: 1.19.4

targets:
  Millisalary:
    type: application
    platform: macOS
    sources:
      - Millisalary
    dependencies:
      - package: MillisalaryCore
      - package: AmplitudeSwift
    info:
      path: Millisalary/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 nalezhytyi
        # Where the update check and scripts/release.sh look for releases
        MillisalaryReleasesRepo: nalezhytyi/swift-millisalary
        # What a fact row is dragged as in Settings' At a Glance, so it
        # takes no text from other apps and gives them none
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.nalezhytyi.millisalary.dial-fact
            UTTypeDescription: Millisalary dial fact
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nalezhytyi.millisalary
        PRODUCT_NAME: Millisalary
        APP_DISPLAY_NAME: Millisalary
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # Off, as in the Electron app: with an ad hoc signature (no Team
        # ID) the hardened runtime's library validation refuses every
        # embedded framework, Amplitude's included, and 0.1.0 crashed at
        # launch. Without notarization it adds nothing
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # A dev build never shares settings, notifications or the login
        # item with an installed Millisalary
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.nalezhytyi.millisalary.debug
          # Told apart from an installed Millisalary in System Settings
          # (Notifications, Login Items) and the app menu
          APP_DISPLAY_NAME: Millisalary Dev

schemes:
  Millisalary:
    build:
      targets:
        Millisalary: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MillisalaryCore/MillisalaryCoreTests
    archive:
      config: Release
